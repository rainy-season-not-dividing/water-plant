name: water-plant

services:
  qdrant:
    image: ${QDRANT_IMAGE:-qdrant/qdrant:v1.12.4}
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - ./qdrant/storage:/qdrant/storage
    restart: unless-stopped

  frontend:
    image: docker.whyfjz.com/water-plant/water-plant-frontend:v0.1.9
    ports:
      - "127.0.0.1:18080:80"
    volumes:
      - ./frontend-nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    image: docker.whyfjz.com/water-plant/water-plant-backend:v0.1.9
    env_file:
      - ./backend.env
    volumes:
      - ./data:/app/data
    expose:
      - "8000"
    depends_on:
      - qdrant
    restart: unless-stopped







