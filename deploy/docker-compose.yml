name: water-plant

services:
  frontend:
    image: docker.whyfjz.com/water-plant/water-plant-frontend:v0.1.3
    ports:
      - "127.0.0.1:18080:80"
    volumes:
      - ./frontend-nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    image: docker.whyfjz.com/water-plant/water-plant-backend:v0.1.3
    env_file:
      - ./backend.env
    volumes:
      - ./data:/app/data
    expose:
      - "8000"
    restart: unless-stopped



